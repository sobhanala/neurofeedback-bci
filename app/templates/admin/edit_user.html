{% extends "base.html" %}
{% block title %}Edit User - NeuroFeedback{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">&#x1F464; Edit User</h1>

<div class="card" style="max-width:480px;">
    <div class="card-header">{{ user.username }}</div>
    <p style="color:var(--text-muted); margin-bottom:1rem;">
        Email: {{ user.email }}
        {% if user.experimenter %} &middot; Experimenter: {{ user.experimenter.username }}{% endif %}
    </p>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label for="password">New Password (leave blank to keep current)</label>
            <input type="password" id="password" name="password" minlength="6" placeholder="Leave blank to keep current password">
        </div>
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
