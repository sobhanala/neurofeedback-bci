{% extends "base.html" %}
{% block title %}Register - NeuroFeedback{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="card">
        <h2>Create Account</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <div class="form-group">
                <label for="experimenter_id">Select Experimenter</label>
                <select id="experimenter_id" name="experimenter_id" required>
                    <option value="">-- Choose Experimenter --</option>
                    {% for exp in experimenters %}
                        <option value="{{ exp.id }}">{{ exp.username }}{% if exp.experimenter_code %} ({{ exp.experimenter_code }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="experimenter_code">Or Enter Experimenter Code</label>
                <input type="text" id="experimenter_code" name="experimenter_code" placeholder="e.g. EXP-TEH-001">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
        <p style="text-align:center; margin-top:1rem; color:var(--text-muted);">
            Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
